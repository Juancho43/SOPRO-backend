services:
  postgres:
     image: postgres:16-alpine
     container_name: sopro_postgres
     restart: always
     environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: sopro_developer
      POSTGRES_DB: sopro_dev
     ports:
      - "5555:5432"
     networks:
      - sopro_net
     volumes:
      - pgdata:/var/lib/postgresql/data
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U developer -d sopro_dev"]
       interval: 5s
       timeout: 5s
       retries: 5

  backend:
    image: golang:1.26-alpine
    container_name: sopro_go_dev
    restart: on-failure
    ports:
      - "8088:8080"
    env_file:
      - .env
    networks:
      - sopro_net
    volumes:
      - .:/app
      - go_cache:/go/pkg/mod
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    command: go run main.go

networks:
  sopro_net:
    driver: bridge

volumes:
  pgdata:
  go_cache: