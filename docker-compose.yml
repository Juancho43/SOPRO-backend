services:
  postgres:
     image: postgres:16-alpine
     container_name: sopro_postgres
     restart: always
     environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: sopro_developer
      POSTGRES_DB: sopro_dev
     ports:
      - "5432:5432"
     volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: golang:1.26-alpine
    container_name: sopro_go_dev
    restart: on-failure
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - .:/app
      - go_cache:/go/pkg/mod
    working_dir: /app
    depends_on:
      - postgres
    command: go run main.go
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  pgdata:
  go_cache: